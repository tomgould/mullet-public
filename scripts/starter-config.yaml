# Mullet Configuration
# Generated by installer — edit to match your setup
# Docs: https://github.com/tomgould/mullet-public

providers:
  # Ollama — local LLM (free, runs on your machine)
  # Make sure Ollama is running: ollama serve
  ollama:
    type: openai_compatible
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY   # set to any string, Ollama doesn't check it
    models:
      llama3.2:
        context_window: 128000
        supports_tools: true
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0

  # LM Studio — alternative local LLM (uncomment if you use LM Studio instead)
  # lmstudio:
  #   type: openai_compatible
  #   base_url: http://localhost:1234/v1
  #   api_key_env: LMSTUDIO_API_KEY
  #   models:
  #     default:
  #       context_window: 32000
  #       supports_tools: true
  #   cost_per_1k_input: 0.0
  #   cost_per_1k_output: 0.0

  # Kimi K2 — fast, cheap cloud API (optional, for larger tasks)
  # Get a key at: https://platform.moonshot.cn
  # kimi:
  #   type: openai_compatible
  #   base_url: https://api.moonshot.cn/v1
  #   api_key_env: KIMI_API_KEY
  #   models:
  #     kimi-k2:
  #       context_window: 131072
  #       supports_tools: true
  #   cost_per_1k_input: 0.0006
  #   cost_per_1k_output: 0.0025

routing:
  enabled: true
  default_tier: MEDIUM
  local_only: true   # Keep everything local by default — change to false to allow cloud providers
  thresholds:
    low_max: 20
    medium_max: 50
  budget:
    per_task_max_tokens: 100000
    session_max_tokens: 1000000
    daily_max_dollars: 0.0   # $0 = local only

knowledge:
  max_knowledge_age: 30
  max_knowledge_count: 100

hud:
  # Dashboard settings — defaults are fine to start
