name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: pip install "ruff==0.17.1" black mypy
      # Blocking: syntax errors and undefined names, which are real bugs.
      - name: Ruff (errors)
        run: ruff check --select E9,F63,F7,F82 mullet scripts
      # Advisory from here on: the code base doesn't pass these cleanly yet, so
      # they report findings without failing the job.
      - name: Ruff (full rule set)
        continue-on-error: true
        run: ruff check mullet scripts
      - name: Black check
        continue-on-error: true
        run: black --check mullet scripts
      - name: Mypy check
        continue-on-error: true
        run: mypy mullet/ --ignore-missing-imports
