name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # A run takes about 1.5 minutes; this is several times that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install lint tools
        timeout-minutes: 5
        run: pip install "ruff==0.17.1" black mypy
      # Blocking: syntax errors and undefined names, which are real bugs. The
      # tests are included because a typo there can hide a test that never runs.
      - name: Ruff (errors)
        run: ruff check --select E9,F63,F7,F82 mullet scripts tests
      # Advisory from here on: the code base doesn't pass these cleanly yet, so
      # they report findings without failing the job.
      - name: Ruff (full rule set)
        continue-on-error: true
        run: ruff check mullet scripts
      - name: Black check
        continue-on-error: true
        run: black --check mullet scripts
      - name: Mypy check
        continue-on-error: true
        timeout-minutes: 10
        run: mypy mullet/ --ignore-missing-imports
