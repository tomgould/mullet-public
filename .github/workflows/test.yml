name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No test needs a real embedding model; without this, code that tries
      # to load one pulls an ~90 MB model from Hugging Face during the run.
      HF_HUB_OFFLINE: "1"
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The CPU build of PyTorch is enough for the tests and far smaller than
      # the CUDA build that sentence-transformers would otherwise pull in.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]" pytest-xdist
      - run: python -m pytest tests/ -n auto -q --tb=short -k "not delegation_safety_d2"
