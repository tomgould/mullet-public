name: DCO

# Every commit in a pull request must carry a `Signed-off-by:` line (`git commit -s`).
# See "Contributor Licence and sign-off" in CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit $commit has no Signed-off-by line (add one with: git commit -s --amend)"
              failed=1
            fi
          done
          exit $failed
